name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ matrix.args }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${VERSION_TAG#v}"
          export VERSION
          [ -n "$VERSION" ] || { echo "Invalid version tag: $VERSION_TAG"; exit 1; }

          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            for (const path of ["src-tauri/tauri.conf.json", "package.json"]) {
              const json = JSON.parse(fs.readFileSync(path, "utf8"));
              json.version = version;
              fs.writeFileSync(path, JSON.stringify(json, null, 2) + "\n");
            }
          '

          python3 - <<'PY'
          import os
          import re

          version = os.environ["VERSION"]
          path = "src-tauri/Cargo.toml"
          text = open(path, "r", encoding="utf-8").read()
          lines = text.splitlines()

          in_package = False
          updated = False
          for i, line in enumerate(lines):
              if line.strip() == "[package]":
                  in_package = True
                  continue
              if in_package:
                  if line.startswith("[") and line.strip().endswith("]"):
                      break
                  m = re.match(r'^\s*version\s*=\s*"[^"]+"', line)
                  if m:
                      lines[i] = 'version = "{}"'.format(version)
                      updated = True
                      break

          if not updated:
              raise SystemExit("Could not update [package] version in src-tauri/Cargo.toml")

          open(path, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          PY

      - name: Show release versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          node -e 'console.log("package.json", require("./package.json").version)'
          node -e 'console.log("tauri.conf.json", require("./src-tauri/tauri.conf.json").version)'
          cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 \
            | node -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => console.log("src-tauri/Cargo.toml", JSON.parse(data).packages[0].version));'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing — set these secrets in repo settings when ready:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BundlerMD ${{ github.ref_name }}
          releaseBody: See the CHANGELOG for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
